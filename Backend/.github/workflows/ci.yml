name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - Backend
  pull_request:
    branches:
      - Backend

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ci_user
      DB_PASS: ci_pass
      DB_NAME: ci_db
      JWT_SECRET: super_secret_ci_testing_key_12345
      JWT_EXPIRES_IN: 7d

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation
        run: npm run build

      - name: Validate TypeORM Configuration
        run: npx ts-node src/database/data-source.ts

      - name: Run Tests
        continue-on-error: true
        run: npm test

  deploy:
    name: Deploy to VPS
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            cd /var/www/vikas-backend

            echo "Updating source..."
            git fetch origin
            git reset --hard origin/Backend

            echo "Installing dependencies..."
            npm ci

            echo "Building..."
            npm run build

            echo "Running migrations..."
            npm run migration:run

            echo "Reloading PM2..."
            pm2 reload ecosystem.config.js --update-env

            echo "Saving PM2..."
            pm2 save

            echo "Deployment completed successfully."