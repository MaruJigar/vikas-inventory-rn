name: Frontend Web CI/CD Pipeline

on:
  push:
    branches: [devlopment]
    paths:
      # Expo application source
      - "Frontend/**"
      # This workflow file itself
      - ".github/workflows/frontend-build.yml"

# Only keep the newest run; cancel superseded ones.
concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Type-check gate
  # ─────────────────────────────────────────────
  typecheck:
    name: TypeScript Typecheck (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # JOB 2: Export Expo Web and deploy to VPS
  # ─────────────────────────────────────────────
  build-and-deploy-web:
    name: Expo Web Export & Deploy
    needs: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    env:
      # Production API base URL — /v1 prefix, no trailing slash
      EXPO_PUBLIC_API_URL: https://api.avchousehold.com/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export Web Build
        run: npx expo export --platform web --non-interactive

      - name: Determine Output Directory
        id: outdir
        run: |
          DIR=$(node -e "const fs=require('fs');const app=fs.existsSync('./app.json')?require('./app.json'):{};console.log(app.expo?.web?.outputDir || 'dist')")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-build
          path: Frontend/${{ steps.outdir.outputs.dir }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            REPO=/var/www/vikas-inventory-rn

            # ── 1. Pull latest code ──────────────────────────────────────
            cd "$REPO"
            git fetch origin
            git checkout devlopment
            git fetch origin
            git reset --hard origin/devlopment

            # ── 2. Install deps ─────────────────────────────────────────
            cd "$REPO/Frontend"
            npm ci

            # ── 3. Clear Metro cache and export ──────────────────────────
            rm -rf .expo dist
            npx expo export --platform web

            # ── 4. Caddy serves dist/ directly — no restart required ────
            echo "✅ Static files deployed to dist/"

            # ── 5. Verify web app is reachable ────────────────────────────
            sleep 3
            curl -sf https://app.avchousehold.com > /dev/null \
              && echo "✅ Expo Web: healthy" \
              || (echo "❌ Expo Web: unhealthy" && exit 1)
