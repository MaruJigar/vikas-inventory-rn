name: Frontend Build

on:
  push:
    branches:
      - frontend
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-build.yml"

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (gate)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

  build:
    name: EAS Android APK
    needs: typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK on EAS
        id: eas
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build.json

          echo "url=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' build.json)" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r '.[0].id // empty' build.json)" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APK_URL: ${{ steps.eas.outputs.url }}
          BUILD_ID: ${{ steps.eas.outputs.id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg branch "$BRANCH" \
            --arg sha "${SHA:0:7}" \
            --arg actor "$ACTOR" \
            --arg apk "${APK_URL:-See Expo Dashboard}" \
            --arg run "$RUN_URL" \
            '{
              username: "Vikas CI",
              embeds: [{
                title: "✅ Frontend Build Succeeded",
                color: 3066993,
                fields: [
                  {name:"Branch", value:$branch, inline:true},
                  {name:"Commit", value:$sha, inline:true},
                  {name:"By", value:$actor, inline:true},
                  {name:"APK", value:$apk},
                  {name:"GitHub Run", value:$run}
                ]
              }]
            }')

          curl -H "Content-Type: application/json" \
               -d "$payload" \
               "$DISCORD_WEBHOOK"

  # Export Expo Web App
  build-web:
    name: Expo Web Export
    needs: typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npx expo install react-native-web react-dom @expo/metro-runtime -- --legacy-peer-deps

      - name: Export Web Build
        run: npx expo export --platform web --non-interactive

      - name: Determine Output Directory
        id: outdir
        run: |
          DIR=$(node -e "const fs=require('fs');const app=fs.existsSync('./app.json')?require('./app.json'):{};console.log(app.expo?.web?.outputDir || 'dist')")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-build
          path: Frontend/${{ steps.outdir.outputs.dir }}