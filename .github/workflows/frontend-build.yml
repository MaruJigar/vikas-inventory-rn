name: Frontend Web CI/CD Pipeline

on:
  push:
    branches: [frontend]
    paths:
      # Expo application source
      - "Frontend/**"
      # This workflow file itself
      - ".github/workflows/frontend-build.yml"

# Only keep the newest run; cancel superseded ones.
concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Type-check gate
  # ─────────────────────────────────────────────
  typecheck:
    name: TypeScript Typecheck (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────
  # JOB 2: Export Expo Web and deploy to VPS
  # ─────────────────────────────────────────────
  build-and-deploy-web:
    name: Expo Web Export & Deploy
    needs: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    env:
      # Production API base URL — /v1 prefix, no trailing slash
      EXPO_PUBLIC_API_URL: https://api.avchousehold.com/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export Web Build
        run: npx expo export --platform web --non-interactive

      - name: Determine Output Directory
        id: outdir
        run: |
          DIR=$(node -e "const fs=require('fs');const app=fs.existsSync('./app.json')?require('./app.json'):{};console.log(app.expo?.web?.outputDir || 'dist')")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-build
          path: Frontend/${{ steps.outdir.outputs.dir }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          # Runner env does NOT cross the SSH boundary. Without this the remote
          # export falls through to the VPS's stale gitignored .env, which still
          # holds the old api domain.
          envs: EXPO_PUBLIC_API_URL

          script: |
            set -e

            REPO=/var/www/vikas-inventory-rn

            # ── 1. Pull latest code ──────────────────────────────────────
            # The backend regenerates tracked files in this same working copy
            # (e.g. Backend/docs/openapi.json), which makes a plain `git
            # checkout` abort. Discard tracked local changes first, and use
            # `checkout -f` so the switch can't be blocked. Untracked/ignored
            # files (node_modules, uploads, .env) are deliberately left alone —
            # no `git clean` here.
            cd "$REPO"
            git fetch origin
            git reset --hard
            git checkout -f frontend
            git reset --hard origin/frontend

            # ── 2. Install deps ─────────────────────────────────────────
            cd "$REPO/Frontend"
            npm ci

            # ── 3. Clear Metro cache and export ──────────────────────────
            # --clear is required: EXPO_PUBLIC_* is inlined at Babel transform
            # time and that cache OUTLIVES `rm -rf .expo`, so without it a
            # stale cached module keeps the OLD api url forever.
            export EXPO_PUBLIC_API_URL
            echo "→ building against: ${EXPO_PUBLIC_API_URL:-<UNSET!>}"
            rm -rf .expo dist
            npx expo export --platform web --clear

            # ── 4. Caddy serves dist/ directly — no restart required ────
            echo "✅ Static files deployed to dist/"

            # ── 5. Verify web app is reachable ────────────────────────────
            sleep 3
            curl -sf https://app.avchousehold.com > /dev/null \
              && echo "✅ Expo Web: healthy" \
              || (echo "❌ Expo Web: unhealthy" && exit 1)

  # ─────────────────────────────────────────────
  # JOB 3: Build the Android APK on EAS + notify
  # ─────────────────────────────────────────────
  build-apk:
    name: EAS Android APK
    needs: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # The APK's api url comes from eas.json (build.preview.env) — this build
      # runs on EAS servers, so runner env does not apply.
      - name: Build Android APK on EAS
        id: eas
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build.json

          echo "url=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' build.json)" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r '.[0].id // empty' build.json)" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APK_URL: ${{ steps.eas.outputs.url }}
          BUILD_ID: ${{ steps.eas.outputs.id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg branch "$BRANCH" \
            --arg sha "${SHA:0:7}" \
            --arg actor "$ACTOR" \
            --arg apk "${APK_URL:-See Expo Dashboard}" \
            --arg run "$RUN_URL" \
            '{
              username: "Vikas CI",
              embeds: [{
                title: "✅ Frontend Build Succeeded",
                color: 3066993,
                fields: [
                  {name:"Branch", value:$branch, inline:true},
                  {name:"Commit", value:$sha, inline:true},
                  {name:"By", value:$actor, inline:true},
                  {name:"APK", value:$apk},
                  {name:"GitHub Run", value:$run}
                ]
              }]
            }')

          curl -H "Content-Type: application/json" \
               -d "$payload" \
               "$DISCORD_WEBHOOK"
