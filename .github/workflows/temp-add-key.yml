name: Temp Add Key
on: [workflow_dispatch]
jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      - name: Add key
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 66.116.197.213
          username: jigar
          password: Jigar@1234
          port: 22
          script: |
            mkdir -p ~/.ssh
            echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIeDazHjvdOc/tPl44TblqN4an4CRcXBUNuHBtDNUqEg jigar@Jigar" >> ~/.ssh/authorized_keys
