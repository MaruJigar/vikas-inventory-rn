name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - Backend
  pull_request:
    branches:
      - Backend

concurrency:
  group: backend-production
  cancel-in-progress: true

defaults:
  run:
    working-directory: Backend

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ci_user
      DB_PASS: ci_pass
      DB_NAME: ci_db
      JWT_SECRET: super_secret_ci_testing_key_12345
      JWT_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate TypeORM
        run: npx ts-node src/database/data-source.ts

      - name: Run Tests
        continue-on-error: true
        run: npm test

  deploy:
    name: Deploy Backend
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            cd /var/www/vikas-inventory-rn

            git fetch origin
            git reset --hard origin/Backend

            cd Backend

            npm ci

            npm run build

            npm run migration:run

            pm2 reload ecosystem.config.js --update-env

            pm2 save