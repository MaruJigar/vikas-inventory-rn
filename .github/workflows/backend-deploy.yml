name: Backend & Admin CI/CD Pipeline

on:
  push:
    branches:
      - devlopment
    paths:
      # Source code
      - "Backend/**"
      - "admin-panel/**"
      # This workflow file itself
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    branches:
      - devlopment
    paths:
      - "Backend/**"
      - "admin-panel/**"
      - ".github/workflows/backend-deploy.yml"

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & Validate the Backend
  # ─────────────────────────────────────────────
  validate-backend:
    name: Build & Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ci_user
      DB_PASS: ci_pass
      DB_NAME: ci_db
      JWT_SECRET: super_secret_ci_testing_key_12345
      JWT_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Backend
        run: npm run build

      - name: Validate TypeORM DataSource
        run: npx ts-node src/database/data-source.ts

      - name: Run Tests
        continue-on-error: true
        run: npm test

  # ─────────────────────────────────────────────
  # JOB 2: Build & Validate the Admin Panel
  # ─────────────────────────────────────────────
  validate-admin:
    name: Build & Validate Admin Panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Admin Panel
        run: npm run build

  # ─────────────────────────────────────────────
  # JOB 3: Deploy (only on push, not PR)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy Backend & Admin to VPS
    needs: [validate-backend, validate-admin]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            REPO=/var/www/vikas-inventory-rn

            # ── 1. Pull latest code ──────────────────────────────────────
            cd "$REPO"
            git fetch origin
            git checkout devlopment
            git pull --ff-only origin devlopment

            # ── 2. Build Backend ─────────────────────────────────────────
            cd "$REPO/Backend"
            npm ci
            rm -rf dist
            npm run build

            # ── 3. Run DB migrations ─────────────────────────────────────
            npm run migration:run

            # ── 4. Reload Backend ────────────────────────────────────────
            pm2 reload ecosystem.config.js --update-env
            pm2 save

            # ── 5. Build Admin Panel ──────────────────────────────────────
            cd "$REPO/admin-panel"
            npm ci
            npm run build

            # ── 6. Reload Admin Panel ─────────────────────────────────────
            pm2 restart vikas-admin

            # ── 7. Verify services are online ────────────────────────────
            sleep 5
            pm2 list

            # Backend health check
            curl -sf https://api.vikas-marketing.work.gd/v1/api/docs > /dev/null \
              && echo "✅ Backend API: healthy" \
              || (echo "❌ Backend API: unhealthy" && exit 1)

            # Admin health check
            curl -sf https://admin.vikas-marketing.work.gd > /dev/null \
              && echo "✅ Admin Panel: healthy" \
              || (echo "❌ Admin Panel: unhealthy" && exit 1)
